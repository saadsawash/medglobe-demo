<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedGlobe demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #101010;
      color: #f2f2f0;
      font-family: system-ui, sans-serif;
    }
    .wrap {
      display: grid;
      gap: 2.5rem;
      text-align: center;
      padding: 2rem;
    }
    h2 {
      margin: 0 0 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.4;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 1rem;
    }
    a {
      color: inherit;
      text-decoration: none;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }
    a:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <section>
      <h2>Corporate</h2>
      <ul>
        <li><a href="../corp-demo-1/index.html">corp-demo-1</a></li>
        <li><a href="../corp-demo-2/index.html">corp-demo-2</a></li>
        <li><a href="../corp-demo-3/index.html">corp-demo-3</a></li>
        <li><a href="../corp-demo-4/index.html">corp-demo-4</a></li>
      </ul>
    </section>
    <section>
      <h2>Steadiwear</h2>
      <ul>
        <li><a href="../steadiwear-product-demo-1/index.html">steadiwear-product-demo-1</a></li>
        <li><a href="../steadiwear-product-demo-2/index.html">steadiwear-product-demo-2</a></li>
        <li><a href="../steadiwear-product-demo-3/index.html">steadiwear-product-demo-3</a></li>
        <li><a href="../steadiwear-product-demo-4/index.html">steadiwear-product-demo-4</a></li>
      </ul>
    </section>
  </div>
</body>
</html>
