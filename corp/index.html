<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedGlobe demos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #101010;
      color: #f2f2f0;
      font-family: system-ui, sans-serif;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 1rem;
      text-align: center;
    }
    a {
      color: inherit;
      text-decoration: none;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }
    a:hover { opacity: 1; }
  </style>
</head>

</html>
